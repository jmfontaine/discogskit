[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.9,<0.14" ]

[project]
name = "discogskit"
version = "0.2.0"
description = "Discogs Data Dumps Toolkit"
readme = "README.md"
keywords = [ "cli", "discogs", "discogs-dump", "music-database" ]
license = "Apache-2.0"
license-files = [ "LICENSE.txt" ]
authors = [ { name = "Jean-Marc Fontaine", email = "jm@jmfontaine.net" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
]
dependencies = [
  "adbc-driver-postgresql>=1.10.0",
  "filelock>=4.0.9",
  "lxml>=6.0.2",
  "psycopg[binary]>=3.3.3",
  "pyarrow>=26",
  "rapidgzip>=0.16.0",
  "rich>=14.3.3",
  "typer>=0.26.1",
]
scripts.discogskit = "discogskit.cli:app"

[dependency-groups]
dev = [
  "deadcode>=2.4.1",
  "deptry>=0.24",
  "lxml-stubs>=0.5.1",
  "prek>=0.3.5",
  "pyproject-fmt>=2.18.1",
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "pytest-cov>=7",
  "ruff>=0.15.6",
  "testcontainers[postgres]>=4.14.1",
  "ty>=0.0.23",
]

[tool.pyproject-fmt]
keep_full_version = true
max_supported_python = "3.14"

[tool.ty]
analysis.allowed-unresolved-imports = [ "rapidgzip" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.markers = [
  "integration: tests that need a PostgreSQL container (testcontainers, Docker)",
]
ini_options.filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage]
run.source = [ "discogskit" ]
# Measures the spawned decompress child. The parse workers, which the pipeline terminates, stay unmeasured: run.sigterm
# would measure them, but coverage's SIGTERM handler can deadlock a worker terminated mid-chunk and hang the run (#226).
run.patch = [ "subprocess" ]

[tool.deadcode]
exclude = [ "benchmarks/alternatives" ]  # competitor checkouts from `just bench-setup`
ignore_bodies_if_inherits_from = [ "Enum" ]  # CLI choice enums: Typer reads their members
ignore_names = [
  "CharacterDataHandler", # expat parser callback
  "DefaultHandler",       # expat parser callback
  "EndElementHandler",    # expat parser callback
  "StartElementHandler",  # expat parser callback
  "XmlDeclHandler",       # expat parser callback
  "_callback",            # Typer app.callback()
  "convert",              # Typer app.command()
  "fetch_command",        # Typer app.command()
  "get_skill",            # Typer app.command()
  "handle_starttag",      # HTMLParser override
  "load",                 # Typer app.command()
  "main",                 # Typer app.command()
  "ordered_attributes",   # expat parser setting
  "readable",             # RawIOBase override
  "resolve_command",      # Typer app.command()
  "return_value",         # mock attribute setup
  "skill_path",           # Typer app.command()
]
