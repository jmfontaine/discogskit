[changelog]
header = ""
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking %}\
    ## Breaking Changes
    {% for commit in breaking %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.footers | filter(attribute="breaking", value=true) | length > 0 %}\
            {{ commit.breaking_description | trim | replace(from="\n", to=" ") }}\
            {% else %}{{ commit.message | upper_first }}{% endif %} - \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jmfontaine/discogskit/commit/{{ commit.id }}))
    {%- endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    ## {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**breaking:** {% endif %}\
            {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }} - \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jmfontaine/discogskit/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    # Version bumps around a release (`just release-prepare`, `just release-next`) aren't news.
    { message = "^chore(\\(release\\))?: (bump version|start .* development|v[0-9])", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore|^ci|^build", group = "Miscellaneous Tasks" },
]
filter_commits = false
tag_pattern = "v[0-9].*"

[git.filter]
exclude_patterns = ["^Merge"]
