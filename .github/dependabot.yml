version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Update uv.lock only, never the requirements in pyproject.toml: those are
    # the floors the published package declares, and they move by hand.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
    labels: ["dependencies", "build"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
    labels: ["dependencies", "build"]
    groups:
      actions:
        patterns:
          - "*"
