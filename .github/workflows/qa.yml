name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      macos:
        description: Also run tests and the type check on macOS
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      macos:
        description: Also run tests and the type check on macOS
        default: false
        type: boolean

permissions:
  contents: read

# Linux job names must stay as they are: the main ruleset requires them by name.
# Naming a job after matrix values also stops GitHub appending "(ubuntu-latest)".
#
# Every job sets UV_PYTHON: uv otherwise takes the version from the tracked .python-version, which
# outranks any interpreter a job installs.
#
# Every setup-uv step pins uv's version, which otherwise is the latest uv at run time. Bump it
# deliberately, in every workflow at once.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python formatting
        run: uv run ruff format --check

      - name: Lint Python
        run: uv run ruff check

      - name: Check pyproject.toml formatting
        run: uv run pyproject-fmt --check pyproject.toml

      - name: Check for unused dependencies
        run: uv run deptry src

      - name: Lint GitHub Actions workflows
        run: uv run prek run actionlint --all-files

  # KLUDGE: Separate job because deadcode uses ast.Str which was removed in Python 3.14
  dead-code:
    name: Dead code
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check for dead code
        run: scripts/dead-code.sh

  typecheck:
    # ty checks against the platform it runs on, so it runs on each OS.
    name: Type check${{ matrix.os == 'macos-latest' && ' (macOS)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run ty check

      - name: Verify public API types
        run: uv run pyright --ignoreexternal --verifytypes discogskit

  test:
    name: Test (Python ${{ matrix.python-version }}${{ matrix.os == 'macos-latest' && ', macOS' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        # TODO: 3.15 builds rapidgzip and adbc-driver-manager from source until they publish cp315 wheels
        # (mxmlnkn/rapidgzip#72, apache/arrow-adbc#4856), so it is not a required check yet (#266).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    # macOS runners have no Docker or GNU time, so only Ubuntu jobs fail when the PostgreSQL or GNU time tests can't
    # run.
    env:
      DISCOGSKIT_REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      DISCOGSKIT_REQUIRE_GNU_TIME: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov -rs

  # The oldest dependency versions pyproject.toml allows, on the oldest Python. Dependabot moves only uv.lock, so
  # without this job nothing tests the minimums the published package declares. Deprecations are fatal here, so an old
  # dependency calling a deprecated API fails now rather than when that API is removed.
  test-lowest:
    name: Test (lowest dependencies)
    runs-on: ubuntu-latest
    env:
      DISCOGSKIT_REQUIRE_DOCKER: "1"
      DISCOGSKIT_REQUIRE_GNU_TIME: "1"
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      # --isolated installs into a throwaway environment, resolved afresh rather than from uv.lock. The skill reference
      # check is left out: references/commands.md is generated from the help text of the locked Typer, which older Typer
      # versions format differently.
      - name: Run tests
        run: >-
          uv run --isolated --resolution lowest-direct
          pytest -rs -W error::DeprecationWarning -W error::PendingDeprecationWarning
          --deselect tests/test_skills.py::test_generated_reference_is_current
